name: Build and Release

on:
  push:
    branches: ["master", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Verify EXE and SHA256
        shell: pwsh
        run: |
          $exe = "build/Release/SurfaceBatteryDiag.exe"
          if (-not (Test-Path $exe)) { throw "EXE not produced" }
          Get-Item $exe | Format-List Name,Length,FullName
          Get-FileHash $exe -Algorithm SHA256

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurfaceBatteryDiag-windows-x64
          path: build/Release/SurfaceBatteryDiag.exe
          if-no-files-found: error

      - name: Publish v1.0.0
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "v1.0.0"
          $repo = "${{ github.repository }}"
          if (gh release view $version --repo $repo *> $null) {
            Write-Host "$version already exists; leaving the published release unchanged."
            exit 0
          }

          $exe = "build/Release/SurfaceBatteryDiag.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()

          @"
          First stable release of SurfaceBatteryDiag.

          Focus:
          - direct Windows battery-class telemetry
          - WMI BatteryStatus cross-check
          - Surface battery PnP/driver identity
          - 10-second raw discharge-rate trace
          - experimental user-mode ACPI _BST/_BIX/_BIF probe
          - English, search-friendly diagnostic output

          SHA256: $hash
          "@ | Set-Content release-notes.md -Encoding utf8

          gh release create $version $exe --repo $repo --target "${{ github.sha }}" --title "SurfaceBatteryDiag v1.0.0" --notes-file release-notes.md
